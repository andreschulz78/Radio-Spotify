name: Radio → Spotify

# Dauerlauf: ein Job synchronisiert ~5 h 40 min lang jede Minute.
# Der Zeitplan stellt alle 30 Min. einen Nachfolger in die Warteschlange (concurrency),
# der direkt nach Ende des laufenden Jobs startet.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Playlist leeren und neu aufbauen"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Dauerlauf
        run: |
          git config user.name "radio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -u radio_spotify.py --loop 340 ${{ inputs.reset && '--reset' || '' }}
        env:
          RADIO_URL: ${{ secrets.RADIO_URL }}
          RADIO_TITLE_PREFIX: ${{ secrets.RADIO_TITLE_PREFIX }}
          RADIO_PLAYLIST_NAME: ${{ secrets.RADIO_PLAYLIST_NAME }}
          RADIO_PLAYLIST_DESC: ${{ secrets.RADIO_PLAYLIST_DESC }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
